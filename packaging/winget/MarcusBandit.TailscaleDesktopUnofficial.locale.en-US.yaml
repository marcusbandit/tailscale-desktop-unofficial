Description: |-
  An unofficial desktop app for your tailnet, not made by or affiliated with Tailscale Inc.
  It lists every device with its OS, online state and address, draws an access graph of who
  can reach whom, sends files with Taildrop, pings devices, and switches exit nodes, subnet
  routes and shields up. It talks to the Tailscale app already running on the machine.
