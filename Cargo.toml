[package]
name = "tailscale-desktop-unofficial"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unofficial desktop app for Tailscale: devices, access graph and Taildrop"
repository = "https://github.com/marcusbandit/tailscale-desktop-unofficial"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.36"
png = "0.18"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
strip = true

[build-dependencies]
winresource = "0.1.34"

# Linux keeps the secret through secret-tool; the others use the OS keyring.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
